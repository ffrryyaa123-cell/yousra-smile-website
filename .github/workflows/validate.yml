name: Validate Yousra Smile

on:
  push:
    branches: [main, hostinger-stage-1]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npm run lint

      - name: Build client
        run: npm run build:client
