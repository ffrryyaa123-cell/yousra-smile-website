name: Deploy Yousra Smile

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yousra-smile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check persistence safeguards
        run: npm run validate:persistence

      - name: Check review-only agent safeguards
        run: npm run agent:validate

      - name: Check TypeScript
        run: npm run lint

      - name: Build production site
        run: npm run build

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        run: npm run build

      - name: Prepare GitHub Pages files
        run: |
          git show origin/gh-pages:CNAME > dist/CNAME
          git show origin/gh-pages:robots.txt > dist/robots.txt
          git show origin/gh-pages:sitemap.xml > dist/sitemap.xml
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
          rm -f dist/server.cjs dist/server.cjs.map

      - name: Publish to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          clean: true
          commit-message: Deploy latest Yousra Smile updates
