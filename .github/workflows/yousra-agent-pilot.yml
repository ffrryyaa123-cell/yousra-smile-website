name: Yousra Smile Agent Pilot

on:
  workflow_dispatch:
  push:
    branches:
      - feat/yousra-smile-agents-pilot
    paths:
      - "agents/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/yousra-agent-pilot.yml"

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run approval-gated pilot
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm run agent:pilot

      - name: Upload pilot review files
        uses: actions/upload-artifact@v4
        with:
          name: instant-pot-pilot-review
          path: pilot-results/*
          if-no-files-found: error

